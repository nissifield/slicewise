[package]
name = "slicewise"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
